# 대표어 통합
# - SourceQuestion / LinkedQuestion / Main / Sketch / Addition -> Question.variant_role
# - 핵심 풀이 아이디어 / 풀이 전략 -> decisive SolutionStep의 MechanismCode 순서열
# - 검토 결과 / 오류 / 피드백 -> ValidationResult
# - 채택 가능 원문 / 생성용 카드 -> DonorCard
# - 원문에서 추출한 사실 -> ProblemFacts
# - 사실에 부여한 개념·표현·메커니즘 분류 -> ProblemSemantics

