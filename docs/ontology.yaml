# Aleph 미니 도메인 온톨로지
#
# 이 파일은 인터뷰에서 발견한 업무 개념과 math-report 개발팀의 기존 도메인 모델을
# 하나의 그래프로 정렬한 것이다. 구현에 이미 존재하는 이름을 우선 대표어로 사용한다.
#
# 출처 필드
# - evidence: 실제 사람에게 받은 인터뷰 로그
# - artifact_evidence: 실제 프로젝트 검수 장부에서 역추적한 과거 사건
# - implementation_source: 개발팀 코드·검수 데이터·인스턴스 데이터
# - design_source: 팀이 정한 제품 범위와 Main-Sketch-Addition 구조
#
# 네 출처는 서로 대체하거나 합산하지 않는다.

version: 2

metadata:
  name: Aleph 문항 의미·연계 생성·검증 온톨로지
  status: accepted_for_project_use
  approved_on: "2026-09-23"
  last_updated: "2026-09-23"
  canonical_model: "math-report metadata_schema.py semantic-v7"
  principles:
    - 원문에서 확인 가능한 사실과 해석한 의미를 분리한다.
    - 수학 개념, 표현, 풀이 메커니즘을 서로 다른 축으로 관리한다.
    - 생성기에는 원문 전체가 아니라 DonorCard만 노출한다.
    - 세부 풀이 메커니즘은 자유 텍스트가 아니라 폐쇄형 MechanismCode를 사용한다.
    - 검수 결과는 원본 검증 상태와 생성 후보 피드백을 구분해 저장한다.
    - AI로 문장과 CSV를 정리했더라도 원응답자가 실존하고 출처가 확인되면 human_interview로 관리한다.

