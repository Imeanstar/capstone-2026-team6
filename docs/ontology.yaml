# 수학 연계문항 제작·검토 미니 온톨로지 (강의 2 산출물)
# evidence는 docs/research/interviews.md의 로그 번호를 가리킨다.
# Question의 SOURCE와 CANDIDATE는 서로 다른 클래스가 아니라 question_role 값이다.

version: 1
classes:
  QuestionDeveloper:
    description: 수학 문항을 만들거나 검토하는 사람
    evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
    attributes:
      role: {type: enum, values: [수학 문항 제작자, 학원 수학 강사], evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]}
    relations:
      - defines: GenerationRequest
        evidence: [로그 3, 로그 5, 로그 9]
      - creates: Question
        evidence: [로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      - reviews: Question
        evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]

  GenerationRequest:
    description: 원문항과 목표 난도·사용 목적을 묶은 문항 제작 조건
    evidence: [로그 3, 로그 5, 로그 8, 로그 9]
    attributes:
      intended_use: {type: string, examples: [보충지, 모의고사 회차, 수업], evidence: [로그 3, 로그 5, 로그 9]}
    relations:
      - uses_source: Question
        evidence: [로그 3, 로그 5, 로그 8, 로그 9]
      - preserves: SolutionIdea
        evidence: [로그 3, 로그 5, 로그 8, 로그 9]
      - targets: DifficultyProfile
        evidence: [로그 3, 로그 9]
      - produces: Question
        evidence: [로그 3, 로그 5, 로그 8, 로그 9]

  Question:
    description: 원문항 또는 이를 바탕으로 만든 후보 문항
    evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
    attributes:
      question_role: {type: enum, values: [SOURCE, CANDIDATE], evidence: [로그 3, 로그 5, 로그 8, 로그 9]}
      topic: {type: string, examples: [미분, 적분, 수열, 로그함수], evidence: [로그 3, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]}
      solution: {type: string, evidence: [로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9]}
    relations:
      - derived_from: Question
        evidence: [로그 3, 로그 5, 로그 8, 로그 9]
      - contains: Condition
        evidence: [로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      - uses: SolutionIdea
        evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      - has: DifficultyProfile
        evidence: [로그 1, 로그 2, 로그 3, 로그 5, 로그 8, 로그 9]
      - receives: ReviewResult
        evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]

  Condition:
    description: 답과 풀이 경로에 영향을 주는 문항의 조건
    evidence: [로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
    attributes:
      content: {type: string, evidence: [로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]}
      role: {type: string, examples: [정답결정, 풀이유도, 경계처리, 수업범위 조절], evidence: [로그 2, 로그 3, 로그 4, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]}
      boundary_rule: {type: string, nullable: true, note: 경계값이나 0에서 별도로 확인할 조건, evidence: [로그 3, 로그 6, 로그 8]}
      applicability_rule: {type: string, nullable: true, note: 정의역과 풀이 적용에 필요한 조건, evidence: [로그 7]}
      curriculum_aligned: {type: boolean, evidence: [로그 9]}
    relations:
      - belongs_to: Question
        evidence: [로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]

  SolutionIdea:
    description: 문항의 핵심 수학적 판단과 풀이 발상
    evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
    attributes:
      concept: {type: string, examples: [도함수, 적분, 수열, 합성함수, 그래프 교점], evidence: [로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]}
      mechanism: {type: string, examples: [극점 판정, 오차 누적, 적분 관계, 역방향 분기, 교점 식 빼기], evidence: [로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]}
      transferable: {type: boolean, note: 원문과 후보 사이에서 풀이 발상을 유지할 수 있는지, evidence: [로그 3, 로그 5, 로그 8, 로그 9]}
    relations:
      - extracted_from: Question
        evidence: [로그 3, 로그 5, 로그 8, 로그 9]
      - reused_in: Question
        evidence: [로그 3, 로그 5, 로그 8, 로그 9]

  DifficultyProfile:
    description: 문항이 목표하는 난도와 실제 학생 검증 여부
    evidence: [로그 1, 로그 2, 로그 3, 로그 5, 로그 8, 로그 9]
    attributes:
      target_level: {type: string, examples: [준킬러, 킬러, 상위권], evidence: [로그 1, 로그 3, 로그 9]}
      student_verified: {type: boolean, note: 실제 학생 풀이로 난도를 확인했는지, evidence: [로그 5]}

  ReviewResult:
    description: 후보 문항을 풀고 검토한 뒤 남긴 오류와 처리 판단
    evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
    attributes:
      validity_issue: {type: boolean, evidence: [로그 2, 로그 3, 로그 4, 로그 6, 로그 7, 로그 8, 로그 10]}
      curriculum_issue: {type: boolean, evidence: [로그 9]}
      verdict: {type: enum, values: [USE, REVISE, HOLD], evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8]}
      reason: {type: string, evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]}
      reviewer_type: {type: enum, values: [SELF, PEER, AI], evidence: [로그 2, 로그 3, 로그 4, 로그 6, 로그 8]}
    relations:
      - evaluates: Question
        evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      - identifies: Condition
        evidence: [로그 2, 로그 3, 로그 4, 로그 6, 로그 7, 로그 8, 로그 10]

# 범위 밖(명시): 결제·판매·정산 / PDF·이미지 수식 복원 / 공간도형 자동 작도 /
# 실제 학생 데이터 없이 정답률·체감 난도 확정 / 전 수학 영역의 상용 품질 보장
# 핵심 흐름: 일곱 클래스 모두 한 번 이상 등장한다.
# QuestionDeveloper --(defines)--> GenerationRequest
# GenerationRequest --(uses_source)--> Question(SOURCE)
# GenerationRequest --(preserves)--> SolutionIdea
# GenerationRequest --(targets)--> DifficultyProfile
# GenerationRequest --(produces)--> Question(CANDIDATE)
# Question(CANDIDATE) --(derived_from)--> Question(SOURCE)
# Question(CANDIDATE) --(contains)--> Condition
# Question(CANDIDATE) --(receives)--> ReviewResult
